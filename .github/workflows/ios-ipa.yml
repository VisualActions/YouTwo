name: Build iOS IPA (unsigned)

# Produces a sideloadable, UNSIGNED .ipa of the YouTwo mobile app.
# No Apple Developer account or secrets are required — sign it on your own
# machine with AltStore / Sideloadly, or install with TrollStore.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios-ipa.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Supabase URL to bake into the build (falls back to the SUPABASE_URL variable/secret)"
        required: false
      supabase_anon_key:
        description: "Supabase anon key (falls back to the SUPABASE_ANON_KEY variable/secret)"
        required: false

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS runner is mandatory: xcodebuild only exists on macOS.
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # These are public client values (anon key only) and are compiled into
      # the bundle. Never put the service_role key here.
      - name: Write env
        env:
          SUPABASE_URL: ${{ github.event.inputs.supabase_url || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ github.event.inputs.supabase_anon_key || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY not set — the app will build but can't reach a server."
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL" >> .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env

      # Generates the native ios/ project from app.json. It is not committed,
      # so the build always matches the current JS config.
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        run: npx pod-install --non-interactive

      - name: Resolve scheme and workspace
        id: xc
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Building scheme '$SCHEME' from '$WORKSPACE'"

      # Expo 57 / RN 0.86 pull some dependencies through Swift Package Manager.
      # Resolving them in their own step gives a readable error when it fails
      # and a writable cache dir, instead of a bare "Could not resolve package
      # dependencies" in the middle of the build.
      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3; do
            echo "resolve attempt $attempt"
            if xcodebuild -resolvePackageDependencies \
                 -workspace "${{ steps.xc.outputs.workspace }}" \
                 -scheme "${{ steps.xc.outputs.scheme }}" \
                 -clonedSourcePackagesDirPath spm-cache \
                 -disableAutomaticPackageResolution NO; then
              echo "resolved"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Swift package resolution failed after 3 attempts"
          exit 1

      # Code signing is disabled outright — that is what makes this build
      # possible without an Apple Developer account.
      - name: Build (unsigned archive)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath spm-cache \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -vE "^\s*(note|warning):" || {
              echo "::group::last 200 lines of xcodebuild output"
              tail -200 xcodebuild.log
              echo "::endgroup::"
              exit 1
            }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile/xcodebuild.log
          if-no-files-found: ignore

      # An .ipa is just a zip with the .app inside a Payload/ directory.
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            echo "::error::No .app produced by the build"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YouTwo-unsigned.ipa Payload
          ls -lh YouTwo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YouTwo-unsigned-ipa
          path: mobile/YouTwo-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
