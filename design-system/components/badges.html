<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: Roboto, "Segoe UI", Arial, sans-serif; padding: 24px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 18px; }
  .cap { width: 100%; font-size: 12px; color: #aaaaaa; margin-bottom: -8px; }
  .live { background: #ff0033; color: #fff; font-size: 11px; font-weight: 600; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; }
  .duration { background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 500; border-radius: 4px; padding: 2px 4px; }
  .pill { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500; }
  .ready { background: rgba(34,197,94,.15); color: #4ade80; }
  .processing { background: rgba(234,179,8,.15); color: #facc15; }
  .failed { background: rgba(239,68,68,.15); color: #f87171; }
  .verify-on { background: rgba(62,166,255,.15); color: #3ea6ff; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  .verify-off { background: #272727; color: #aaaaaa; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  .name { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; }
  .check { width: 15px; height: 15px; fill: #aaaaaa; }
  .reddot { width: 6px; height: 6px; border-radius: 50%; background: #ff0033; display: inline-block; }
  .tag { color: #3ea6ff; font-size: 14px; }
</style>
