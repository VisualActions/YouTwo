<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: Roboto, "Segoe UI", Arial, sans-serif; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; padding: 0 16px; }
  .brand { display: flex; align-items: center; gap: 4px; }
  .mark { width: 36px; height: 24px; background: #ff0033; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .mark svg { width: 16px; height: 16px; fill: #fff; }
  .word { font-size: 20px; font-weight: 600; letter-spacing: -0.05em; }
  .search { display: flex; height: 40px; flex: 1; max-width: 576px; }
  .search input { flex: 1; background: #121212; border: 1px solid #303030; border-right: none; border-radius: 20px 0 0 20px; color: #f1f1f1; padding: 0 16px; font-size: 16px; outline: none; }
  .search input::placeholder { color: #aaaaaa; }
  .search button { width: 64px; background: #272727; border: 1px solid #303030; border-radius: 0 20px 20px 0; color: #f1f1f1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .right { display: flex; align-items: center; gap: 8px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .iconbtn:hover { background: #272727; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #7c4dff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
  .menu { width: 288px; background: #272727; border-radius: 12px; padding: 8px 0; margin: 12px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .menu .head { display: flex; gap: 16px; padding: 8px 16px; }
  .menu hr { border: none; border-top: 1px solid #303030; margin: 8px 0; }
  .menu .item { display: flex; align-items: center; gap: 16px; padding: 8px 16px; font-size: 14px; }
  .menu .item:hover { background: #3f3f3f; }
  svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
</style>
