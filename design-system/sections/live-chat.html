<!-- @dsCard group="Sections" -->
<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: Roboto, "Segoe UI", Arial, sans-serif; padding: 24px; }
  .chat { width: 400px; height: 480px; border: 1px solid #303030; border-radius: 12px; display: flex; flex-direction: column; }
  .head { padding: 12px 16px; border-bottom: 1px solid #303030; font-weight: 500; font-size: 14px; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; gap: 8px; font-size: 13px; line-height: 20px; }
  .mini { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; }
  .who { color: #aaaaaa; font-weight: 500; margin-right: 6px; }
  .foot { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #303030; }
  .foot input { flex: 1; height: 40px; border-radius: 20px; border: 1px solid #303030; background: #121212; color: #f1f1f1; padding: 0 16px; font-size: 13px; outline: none; font-family: inherit; }
  .foot input:focus { border-color: #3ea6ff; }
  .send { height: 40px; border-radius: 20px; padding: 0 16px; background: #3ea6ff; color: #0f0f0f; border: none; font-weight: 500; font-size: 13px; cursor: pointer; font-family: inherit; }
</style>
<div class="chat">
  <div class="head">Live chat</div>
  <div class="msgs">
    <div class="msg"><span class="mini" style="background:#e91e63">D</span><p style="margin:0"><span class="who">Dev Channel</span>yo this stream is clean</p></div>
    <div class="msg"><span class="mini" style="background:#009688">K</span><p style="margin:0"><span class="who">KitCat</span>how did you get the latency this low??</p></div>
    <div class="msg"><span class="mini" style="background:#7c4dff">Y</span><p style="margin:0"><span class="who">YoStudios</span>2s segments + LL config in hls.js</p></div>
    <div class="msg"><span class="mini" style="background:#3f51b5">S</span><p style="margin:0"><span class="who">Seqyr</span>W</p></div>
  </div>
  <div class="foot">
    <input placeholder="Chat..." />
    <button class="send">Send</button>
  </div>
</div>
