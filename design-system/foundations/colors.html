<!-- @dsCard group="Colors" -->
<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: Roboto, "Segoe UI", Arial, sans-serif; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .sw { border-radius: 12px; border: 1px solid #303030; overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-size: 12px; }
  .meta b { display: block; font-size: 13px; }
  .meta span { color: #aaaaaa; }
</style>
<h3 style="margin:0 0 12px; font-size:15px;">YouTwo palette (dark only)</h3>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#0f0f0f"></div><div class="meta"><b>Page bg</b><span>#0f0f0f</span></div></div>
  <div class="sw"><div class="chip" style="background:#212121"></div><div class="meta"><b>Surface</b><span>#212121</span></div></div>
  <div class="sw"><div class="chip" style="background:#272727"></div><div class="meta"><b>Raised</b><span>#272727</span></div></div>
  <div class="sw"><div class="chip" style="background:#3f3f3f"></div><div class="meta"><b>Hover</b><span>#3f3f3f</span></div></div>
  <div class="sw"><div class="chip" style="background:#303030"></div><div class="meta"><b>Border</b><span>#303030</span></div></div>
  <div class="sw"><div class="chip" style="background:#f1f1f1"></div><div class="meta"><b>Text</b><span>#f1f1f1</span></div></div>
  <div class="sw"><div class="chip" style="background:#aaaaaa"></div><div class="meta"><b>Text secondary</b><span>#aaaaaa</span></div></div>
  <div class="sw"><div class="chip" style="background:#ff0033"></div><div class="meta"><b>Brand red / LIVE</b><span>#ff0033</span></div></div>
  <div class="sw"><div class="chip" style="background:#3ea6ff"></div><div class="meta"><b>Action blue</b><span>#3ea6ff</span></div></div>
  <div class="sw"><div class="chip" style="background:#121212"></div><div class="meta"><b>Input bg</b><span>#121212</span></div></div>
</div>
