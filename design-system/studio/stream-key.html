<!-- @dsCard group="Studio" -->
<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font-family: Roboto, "Segoe UI", Arial, sans-serif; padding: 24px; max-width: 560px; }
  .panel { border: 1px solid #303030; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  label { font-size: 14px; font-weight: 500; display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 8px; }
  code { flex: 1; height: 40px; line-height: 40px; border: 1px solid #303030; border-radius: 8px; background: #121212; padding: 0 12px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon { width: 40px; height: 40px; border-radius: 8px; background: #272727; border: none; color: #f1f1f1; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon:hover { background: #3f3f3f; }
  .hint { font-size: 12px; color: #aaaaaa; }
  .regen { height: 36px; border-radius: 18px; padding: 0 16px; background: #272727; color: #f1f1f1; border: none; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; width: fit-content; font-family: inherit; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
</style>
<div class="panel">
  <div>
    <label>Ingest URL</label>
    <div class="row">
      <code>rtmp://localhost:1935/live</code>
      <button class="icon" title="Copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    </div>
  </div>
  <div>
    <label>Stream key</label>
    <div class="row">
      <code>••••••••••••••••••••••••••••••••</code>
      <button class="icon" title="Reveal"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="icon" title="Copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    </div>
    <p class="hint" style="margin:8px 0 0;">Keep this secret. Anyone with the key can stream as your channel.</p>
  </div>
  <button class="regen"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>Regenerate key</button>
</div>
